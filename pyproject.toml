[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recheck"
version = "0.1.0"
description = "A caseload agent that re-checks the combined rating in VA decision letters and asks a person only when the answer would change the rating"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "strands-agents==1.55.1",
  "pydantic==2.13.5",
  "pypdf==6.18.1",
]

[project.optional-dependencies]
# fpdf2 builds PDFs for the PDF-ingestion tests only.
dev = ["pytest==9.1.1", "fpdf2==2.8.8"]
# Live providers are OPTIONAL. The canonical verification path (--scripted)
# needs none of them, and the core product does not depend on provider
# availability.
anthropic = ["strands-agents[anthropic]==1.55.1"]
ollama = ["strands-agents[ollama]==1.55.1"]

[project.scripts]
recheck = "recheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
