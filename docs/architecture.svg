<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Recheck architecture</title>
  <desc id="desc">recheck sweep runs one Strands Graph per decision letter: extract, classify, assess, compute. Assess can interrupt for a reviewer answer (resumed in a new process) or end UNDETERMINED. Results go to a triage report.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6472"/>
    </marker>
    <marker id="ahGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2e7d32"/>
    </marker>
    <marker id="ahAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b26a00"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="820" fill="#ffffff"/>

  <!-- title + legend -->
  <text x="28" y="36" font-size="18" font-weight="700" fill="#1a1f27">Recheck architecture</text>
  <g font-size="13" fill="#1a1f27">
    <rect x="880" y="23" width="16" height="16" rx="3" fill="#e8f0fb" stroke="#1f5fbf" stroke-width="1.6"/>
    <text x="904" y="36">DETERMINISTIC</text>
    <rect x="1024" y="23" width="16" height="16" rx="3" fill="#fff4e0" stroke="#b26a00" stroke-width="1.6"/>
    <text x="1048" y="36">AI</text>
    <rect x="1086" y="23" width="16" height="16" rx="3" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6"/>
    <text x="1110" y="36">HUMAN</text>
  </g>

  <!-- outer sweep frame -->
  <rect x="12" y="54" width="1176" height="758" rx="10" fill="#f6f7f9" stroke="#8a929e" stroke-width="1.5"/>
  <text x="28" y="80" font-size="16" font-weight="700" fill="#1a1f27">recheck sweep - for each letter in a folder<tspan dx="12" font-size="13" font-weight="400" fill="#3b4350">(a CVSO / accredited representative's caseload)</tspan></text>

  <!-- Strands Graph boundary -->
  <rect x="380" y="98" width="432" height="567" rx="10" fill="#ffffff" stroke="#5b6472" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text x="396" y="121" font-size="14" font-weight="700" fill="#1a1f27">Strands Graph per letter (GraphBuilder)</text>

  <!-- ===== connectors (drawn before boxes/markers) ===== -->
  <g fill="none" stroke-width="1.6">
    <!-- input -> extract -->
    <line x1="352" y1="168" x2="395" y2="168" stroke="#5b6472" marker-end="url(#ah)"/>
    <!-- extract -> classify -->
    <line x1="596" y1="210" x2="596" y2="257" stroke="#5b6472" marker-end="url(#ah)"/>
    <!-- classify -> assess -->
    <line x1="596" y1="406" x2="596" y2="439" stroke="#5b6472" marker-end="url(#ah)"/>
    <!-- assess -> compute -->
    <line x1="596" y1="529" x2="596" y2="576" stroke="#5b6472" marker-end="url(#ah)"/>
    <!-- compute -> report -->
    <line x1="596" y1="649" x2="596" y2="743" stroke="#5b6472" marker-end="url(#ah)"/>
    <!-- classify <-> model boundary -->
    <line x1="353" y1="318" x2="395" y2="318" stroke="#b26a00" stroke-dasharray="5 3" marker-start="url(#ahAmber)" marker-end="url(#ahAmber)"/>
    <!-- assess -> UNDETERMINED -->
    <path d="M396 506 H190 V531" stroke="#5b6472" marker-end="url(#ah)"/>
    <!-- assess -> INTERRUPT -->
    <line x1="796" y1="470" x2="855" y2="470" stroke="#2e7d32" marker-end="url(#ahGreen)"/>
    <!-- INTERRUPT -> FileSessionManager -->
    <line x1="1100" y1="514" x2="1100" y2="541" stroke="#5b6472" marker-end="url(#ah)"/>
    <!-- FileSessionManager -> resume (crosses process boundary) -->
    <line x1="1100" y1="613" x2="1100" y2="659" stroke="#5b6472" marker-end="url(#ah)"/>
    <!-- resume -> back into assess -->
    <path d="M856 695 H834 V510 H797" stroke="#2e7d32" marker-end="url(#ahGreen)"/>
    <!-- NodeTimeline hook attachment -->
    <line x1="812" y1="172" x2="856" y2="172" stroke="#8a929e" stroke-dasharray="4 3"/>
  </g>
  <circle cx="812" cy="172" r="3.5" fill="#8a929e"/>

  <!-- ===== input ===== -->
  <rect x="28" y="138" width="324" height="60" rx="8" fill="#ffffff" stroke="#8a929e" stroke-width="1.5"/>
  <text x="42" y="162" font-size="14" font-weight="700" fill="#1a1f27">decision letters</text>
  <text x="42" y="182" font-size="13" fill="#3b4350">.txt or text-layer .pdf</text>

  <!-- ===== nodes ===== -->
  <!-- extract -->
  <rect x="396" y="138" width="400" height="72" rx="8" fill="#e8f0fb" stroke="#1f5fbf" stroke-width="1.8"/>
  <text x="412" y="161" font-size="15" font-weight="700" fill="#1a1f27">extract</text>
  <rect x="674" y="145" width="110" height="22" rx="11" fill="#1f5fbf"/>
  <text x="729" y="161" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">DETERMINISTIC</text>
  <text x="412" y="181" font-size="13" fill="#2b3340">ratings, stated combined value,<tspan x="412" dy="17">evidence line numbers</tspan></text>

  <!-- gate: extraction succeeded -->
  <path d="M596 225 L605 234 L596 243 L587 234 Z" fill="#ffffff" stroke="#1f5fbf" stroke-width="1.8"/>
  <text x="614" y="238" font-size="13" fill="#1f5fbf">gate: extraction succeeded</text>

  <!-- classify -->
  <rect x="396" y="258" width="400" height="148" rx="8" fill="#fff4e0" stroke="#b26a00" stroke-width="1.8"/>
  <text x="412" y="281" font-size="15" font-weight="700" fill="#1a1f27">classify</text>
  <rect x="631" y="265" width="153" height="22" rx="11" fill="#b26a00"/>
  <text x="707.5" y="281" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">AI only for the gap</text>
  <text x="412" y="301" font-size="13" fill="#2b3340"><tspan font-weight="700">extremity group:</tspan> deterministic lexicon first;<tspan x="412" dy="17">one Strands Agent structured-output call for</tspan><tspan x="412" dy="17">names the lexicon abstains on</tspan></text>
  <rect x="408" y="347" width="376" height="49" rx="6" fill="#e8f0fb" stroke="#1f5fbf" stroke-width="1.4"/>
  <text x="420" y="366" font-size="13" fill="#2b3340"><tspan font-weight="700">sides:</tspan> read from the letter by deterministic<tspan x="420" dy="18">code - the model has no field for a side</tspan></text>

  <!-- assess -->
  <rect x="396" y="440" width="400" height="89" rx="8" fill="#e8f0fb" stroke="#1f5fbf" stroke-width="1.8"/>
  <text x="412" y="463" font-size="15" font-weight="700" fill="#1a1f27">assess</text>
  <rect x="674" y="447" width="110" height="22" rx="11" fill="#1f5fbf"/>
  <text x="729" y="463" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">DETERMINISTIC</text>
  <text x="412" y="483" font-size="13" fill="#2b3340"><tspan font-weight="700">materiality:</tspan> try every possible answer to<tspan x="412" dy="17">unknown facts through the engine; ask only if</tspan><tspan x="412" dy="17">answers change the final degree</tspan></text>

  <!-- gate: ready (fail-closed) -->
  <path d="M596 544 L605 553 L596 562 L587 553 Z" fill="#ffffff" stroke="#1f5fbf" stroke-width="1.8"/>
  <text x="614" y="557" font-size="13" fill="#1f5fbf">gate: ready (fail-closed)</text>

  <!-- compute -->
  <rect x="396" y="577" width="400" height="72" rx="8" fill="#e8f0fb" stroke="#1f5fbf" stroke-width="1.8"/>
  <text x="412" y="600" font-size="15" font-weight="700" fill="#1a1f27">compute</text>
  <rect x="674" y="584" width="110" height="22" rx="11" fill="#1f5fbf"/>
  <text x="729" y="600" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">DETERMINISTIC</text>
  <text x="412" y="620" font-size="13" fill="#2b3340">38 CFR 4.26 bilateral group (a)-(d) then 4.25<tspan x="412" dy="17">Table I (684/684 published cells)</tspan></text>

  <!-- ===== model boundary (attached to classify) ===== -->
  <rect x="28" y="214" width="324" height="269" rx="8" fill="#fffaf0" stroke="#b26a00" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="42" y="236" font-size="14" font-weight="700" fill="#1a1f27">Model output is untrusted:</text>
  <text x="42" y="256" font-size="13" fill="#2b3340">• strict schema (group + confidence<tspan x="54" dy="17">only, extra fields rejected)</tspan><tspan x="42" dy="17">• confidence floor 0.75</tspan><tspan x="42" dy="17">• 'none' vetoed for limb vocabulary</tspan><tspan x="42" dy="17">• one call with turns=1</tspan><tspan x="42" dy="17">• wall-clock timeout</tspan></text>
  <text x="42" y="361" font-size="13" font-weight="700" fill="#8a5200">Any failure → group unknown.</text>
  <rect x="38" y="374" width="304" height="101" rx="6" fill="#ffffff" stroke="#b26a00" stroke-width="1.2"/>
  <text x="50" y="394" font-size="13" font-weight="700" fill="#1a1f27">provider seam</text>
  <text x="50" y="412" font-size="13" fill="#2b3340"><tspan font-weight="700">ScriptedModel</tspan> (zero-model, replays<tspan x="50" dy="17">committed fixture through Strands'</tspan><tspan x="50" dy="17">real structured-output path)</tspan><tspan x="50" dy="17">Bedrock | Anthropic | Ollama adapters</tspan></text>

  <!-- ===== UNDETERMINED ===== -->
  <rect x="28" y="532" width="324" height="88" rx="8" fill="#ffffff" stroke="#5b6472" stroke-width="1.6"/>
  <text x="42" y="554" font-size="14" font-weight="700" fill="#1a1f27">UNDETERMINED</text>
  <text x="42" y="574" font-size="13" fill="#2b3340">not computed; shows possible ratings</text>
  <text x="42" y="591" font-size="13" font-style="italic" fill="#4a5260">when facts that change the result<tspan x="42" dy="17">stay unknown</tspan></text>

  <!-- ===== NodeTimeline hook ===== -->
  <rect x="856" y="138" width="316" height="69" rx="8" fill="#ffffff" stroke="#8a929e" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="870" y="159" font-size="14" font-weight="700" fill="#1a1f27">NodeTimeline hook</text>
  <text x="870" y="178" font-size="13" fill="#2b3340">(Strands BeforeNodeCallEvent) records<tspan x="870" dy="17">which process ran each node</tspan></text>

  <!-- ===== human interrupt loop ===== -->
  <rect x="856" y="426" width="316" height="88" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.8"/>
  <text x="870" y="448" font-size="14" font-weight="700" fill="#1a1f27">INTERRUPT (Strands Interrupt)</text>
  <text x="870" y="468" font-size="13" fill="#2b3340">question for the reviewer: side or<tspan x="870" dy="17">extremity group only, never a number;</tspan><tspan x="870" dy="17">shows the ratings the answers lead to</tspan></text>

  <rect x="856" y="542" width="316" height="71" rx="8" fill="#ffffff" stroke="#5b6472" stroke-width="1.6"/>
  <text x="870" y="564" font-size="14" font-weight="700" fill="#1a1f27">FileSessionManager</text>
  <text x="870" y="584" font-size="13" fill="#2b3340">session persisted per case;<tspan x="870" dy="17">process exits (exit 2)</tspan></text>

  <!-- process boundary -->
  <line x1="846" y1="633" x2="1180" y2="633" stroke="#3b4350" stroke-width="1.5" stroke-dasharray="8 5"/>
  <rect x="862" y="621" width="154" height="24" fill="#f6f7f9"/>
  <text x="870" y="638" font-size="13" font-weight="700" fill="#3b4350">PROCESS BOUNDARY</text>

  <rect x="856" y="660" width="316" height="71" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.8"/>
  <text x="870" y="682" font-size="14" font-weight="700" fill="#1a1f27">recheck resume</text>
  <text x="870" y="702" font-size="13" fill="#2b3340">a NEW process answers;<tspan x="870" dy="17">answer validated; same graph restored</tspan></text>

  <!-- ===== triage report ===== -->
  <rect x="28" y="744" width="1144" height="54" rx="8" fill="#ffffff" stroke="#5b6472" stroke-width="1.6"/>
  <text x="44" y="776" font-size="14" font-weight="700" fill="#1a1f27">triage report</text>
  <g font-size="13" font-weight="700" fill="#1a1f27" text-anchor="middle">
    <rect x="160" y="758" width="132" height="26" rx="13" fill="#f1f3f6" stroke="#8a929e" stroke-width="1.2"/>
    <text x="226" y="776">NO DISCREPANCY</text>
    <rect x="302" y="758" width="324" height="26" rx="13" fill="#f1f3f6" stroke="#8a929e" stroke-width="1.2"/>
    <text x="464" y="776">POTENTIAL DISCREPANCY (higher / lower)</text>
    <rect x="636" y="758" width="156" height="26" rx="13" fill="#f1f3f6" stroke="#8a929e" stroke-width="1.2"/>
    <text x="714" y="776">NEEDS YOUR ANSWER</text>
    <rect x="802" y="758" width="116" height="26" rx="13" fill="#f1f3f6" stroke="#8a929e" stroke-width="1.2"/>
    <text x="860" y="776">UNDETERMINED</text>
    <rect x="928" y="758" width="156" height="26" rx="13" fill="#f1f3f6" stroke="#8a929e" stroke-width="1.2"/>
    <text x="1006" y="776">COULD NOT PROCEED</text>
  </g>
</svg>
