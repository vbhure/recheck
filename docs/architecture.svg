<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 760" width="1080" height="760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6472"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b3261e"/>
    </marker>
  </defs>

  <rect width="1080" height="760" fill="#fbfbfd"/>

  <text x="32" y="40" font-size="23" font-weight="700" fill="#14181f">Recheck — architecture</text>
  <text x="32" y="63" font-size="13.5" fill="#5b6472">AI interprets · the human resolves ambiguity · deterministic code calculates</text>

  <!-- legend -->
  <g font-size="11.5">
    <rect x="712" y="26" width="15" height="15" rx="3" fill="#e8f0fe" stroke="#3367d6" stroke-width="1.4"/>
    <text x="734" y="38" fill="#14181f">DETERMINISTIC — no model, no network</text>
    <rect x="712" y="47" width="15" height="15" rx="3" fill="#f3e8fd" stroke="#7b3fbf" stroke-width="1.4"/>
    <text x="734" y="59" fill="#14181f">AI — narrow, bounded, validated</text>
    <rect x="712" y="68" width="15" height="15" rx="3" fill="#fdf0e3" stroke="#b56309" stroke-width="1.4"/>
    <text x="734" y="80" fill="#14181f">HUMAN — supplies a side, never a number</text>
  </g>
  <line x1="32" y1="96" x2="1048" y2="96" stroke="#dfe3ea" stroke-width="1"/>

  <!-- INPUT -->
  <rect x="60" y="118" width="250" height="62" rx="7" fill="#fff" stroke="#9aa2ae" stroke-width="1.4"/>
  <text x="185" y="143" font-size="14" font-weight="600" text-anchor="middle" fill="#14181f">VA decision letter</text>
  <text x="185" y="163" font-size="11.5" text-anchor="middle" fill="#5b6472">.txt or text-layer .pdf (synthetic only)</text>
  <text x="330" y="146" font-size="11" fill="#b3261e">image-only PDF → refused</text>
  <text x="330" y="161" font-size="11" fill="#b3261e">(OCR deliberately out of scope)</text>

  <line x1="185" y1="180" x2="185" y2="208" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- EXTRACT -->
  <rect x="60" y="208" width="250" height="86" rx="7" fill="#e8f0fe" stroke="#3367d6" stroke-width="1.6"/>
  <text x="185" y="231" font-size="14" font-weight="600" text-anchor="middle" fill="#14181f">extract</text>
  <text x="72" y="251" font-size="11.5" fill="#2b3340">percentages · stated combined value</text>
  <text x="72" y="267" font-size="11.5" fill="#2b3340">anatomy the 29-term lexicon knows</text>
  <text x="72" y="283" font-size="11.5" fill="#2b3340">emits typed records, never raw prose</text>

  <line x1="185" y1="294" x2="185" y2="322" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- CLASSIFY -->
  <rect x="60" y="322" width="250" height="100" rx="7" fill="#f3e8fd" stroke="#7b3fbf" stroke-width="1.6"/>
  <text x="185" y="345" font-size="14" font-weight="600" text-anchor="middle" fill="#14181f">classify — Strands Agent</text>
  <text x="72" y="365" font-size="11.5" fill="#2b3340">only terminology the lexicon abstains on</text>
  <text x="72" y="381" font-size="11.5" fill="#2b3340">extremity group + laterality only</text>
  <text x="72" y="397" font-size="11.5" fill="#2b3340">structured_output_model, 1 turn max</text>
  <text x="72" y="413" font-size="11.5" fill="#2b3340">1 batched call per letter</text>

  <!-- GUARDS -->
  <rect x="352" y="322" width="238" height="100" rx="7" fill="#fff" stroke="#b3261e" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="471" y="343" font-size="12.5" font-weight="700" text-anchor="middle" fill="#b3261e">GUARDS</text>
  <text x="364" y="363" font-size="11" fill="#2b3340"><tspan font-weight="600">validate</tspan> — strict schema, extra="forbid"</text>
  <text x="364" y="379" font-size="11" fill="#2b3340"><tspan font-weight="600">ground</tspan> — a side absent from the text</text>
  <text x="364" y="393" font-size="11" fill="#2b3340">is refused even at 0.99 confidence</text>
  <text x="364" y="409" font-size="11" fill="#2b3340"><tspan font-weight="600">floor</tspan> — confidence &lt; 0.75 → human</text>
  <line x1="310" y1="372" x2="348" y2="372" stroke="#b3261e" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <text x="608" y="366" font-size="11" fill="#b3261e">any failure →</text>
  <text x="608" y="382" font-size="11" font-weight="600" fill="#b3261e">UNKNOWN /</text>
  <text x="608" y="396" font-size="11" font-weight="600" fill="#b3261e">HUMAN REVIEW</text>
  <line x1="590" y1="372" x2="604" y2="372" stroke="#b3261e" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <line x1="185" y1="422" x2="185" y2="450" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ASSESS -->
  <rect x="60" y="450" width="250" height="72" rx="7" fill="#e8f0fe" stroke="#3367d6" stroke-width="1.6"/>
  <text x="185" y="473" font-size="14" font-weight="600" text-anchor="middle" fill="#14181f">assess</text>
  <text x="72" y="493" font-size="11.5" fill="#2b3340">safe to compute, or ask a human?</text>
  <text x="72" y="509" font-size="11.5" fill="#2b3340">the only node that raises an interrupt</text>

  <!-- HUMAN branch -->
  <line x1="310" y1="486" x2="392" y2="486" stroke="#b56309" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="318" y="478" font-size="10.5" fill="#b56309">ambiguous</text>

  <rect x="396" y="440" width="286" height="122" rx="7" fill="#fdf0e3" stroke="#b56309" stroke-width="1.6"/>
  <text x="539" y="462" font-size="13.5" font-weight="600" text-anchor="middle" fill="#14181f">INTERRUPT → human</text>
  <text x="408" y="482" font-size="11.5" fill="#2b3340">PROCESS A: state persisted, exit code 2</text>
  <text x="408" y="499" font-size="11.5" fill="#2b3340">PROCESS B: a new interpreter restores it</text>
  <text x="408" y="519" font-size="11.5" font-weight="600" fill="#8a4a06">answer is a SIDE only — left/right/unknown</text>
  <text x="408" y="535" font-size="11" fill="#2b3340">validated: index exists, did ask, valid value</text>
  <text x="408" y="551" font-size="11" fill="#2b3340">"2=100" fails — the grammar has no number</text>

  <path d="M 539 562 L 539 588 L 185 588 L 185 604" fill="none" stroke="#b56309" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="185" y1="522" x2="185" y2="604" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="193" y="556" font-size="10.5" fill="#5b6472">clear</text>

  <!-- GATE -->
  <rect x="700" y="440" width="320" height="122" rx="7" fill="#fff" stroke="#b3261e" stroke-width="1.5"/>
  <text x="860" y="462" font-size="12.5" font-weight="700" text-anchor="middle" fill="#b3261e">FAIL-CLOSED SAFETY GATE</text>
  <text x="712" y="482" font-size="11" fill="#2b3340">add_edge("assess", "compute", condition=…)</text>
  <text x="712" y="500" font-size="11" fill="#2b3340">Blocked states: awaiting_human,</text>
  <text x="712" y="514" font-size="11" fill="#2b3340">invalid_answer, unparsed — and an</text>
  <text x="712" y="528" font-size="11" fill="#2b3340">unreadable case file also blocks.</text>
  <text x="712" y="548" font-size="11" font-style="italic" fill="#b3261e">A rejected human answer cannot reach compute.</text>
  <line x1="696" y1="604" x2="696" y2="520" stroke="#b3261e" stroke-width="1.4" stroke-dasharray="4 3"/>
  <line x1="696" y1="520" x2="700" y2="520" stroke="#b3261e" stroke-width="1.4"/>

  <!-- COMPUTE -->
  <rect x="60" y="604" width="630" height="76" rx="7" fill="#e8f0fe" stroke="#3367d6" stroke-width="1.8"/>
  <text x="375" y="627" font-size="14" font-weight="600" text-anchor="middle" fill="#14181f">compute — 38 CFR 4.26 then 4.25, pure Decimal, zero model calls</text>
  <text x="72" y="648" font-size="11.5" fill="#2b3340">4.26: combine the pair, ADD 10% (not combine), round · 4.26(c) compensability · 4.26(d) most favourable result</text>
  <text x="72" y="666" font-size="11.5" fill="#2b3340">4.25: fold pairwise through Table I with ROUND_HALF_UP · verified 684/684 published cells · then convert to nearest 10, 5 up</text>

  <line x1="375" y1="680" x2="375" y2="702" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- OUTPUT -->
  <rect x="60" y="702" width="630" height="44" rx="7" fill="#fff" stroke="#9aa2ae" stroke-width="1.4"/>
  <text x="375" y="729" font-size="13" font-weight="600" text-anchor="middle" fill="#14181f">CLI report · actor-tagged trace · case.json · "POTENTIAL DISCREPANCY — HUMAN REVIEW RECOMMENDED"</text>

  <!-- PROVIDER SEAM -->
  <rect x="700" y="604" width="320" height="142" rx="7" fill="#fff" stroke="#9aa2ae" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="860" y="626" font-size="12.5" font-weight="700" text-anchor="middle" fill="#14181f">MODEL PROVIDER SEAM</text>
  <text x="712" y="646" font-size="11" fill="#2b3340">ScriptedModel — implements stream(), drives</text>
  <text x="712" y="660" font-size="11" fill="#2b3340">the real Strands path. No network, no cost.</text>
  <text x="712" y="680" font-size="11" fill="#2b3340">Live adapter (Bedrock / Anthropic / Ollama)</text>
  <text x="712" y="694" font-size="11" fill="#2b3340">is one swap here and nothing else changes.</text>
  <text x="712" y="716" font-size="11" font-weight="600" fill="#2b3340">No AWS service is used or required.</text>
  <text x="712" y="733" font-size="10.5" font-style="italic" fill="#5b6472">Persistence is local JSON — readable without Strands.</text>
  <line x1="700" y1="675" x2="312" y2="675" stroke="#9aa2ae" stroke-width="0" />
  <path d="M 700 646 L 694 646" fill="none" stroke="#9aa2ae" stroke-width="1.2"/>
  <path d="M 694 646 C 660 646 660 372 594 372" fill="none" stroke="#7b3fbf" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrowRed)"/>
</svg>
